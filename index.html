<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор объявлений</title>
    <style>
        body {
            font-family: sans-serif;
            background: #121212;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e1e1e;
            padding: 25px;
            border-radius: 12px;
            width: 100%;
            max-width: 450px;
            border: 1px solid #333;
            box-sizing: border-box;
        }
        h2 { margin-top: 0; text-align: center; color: #ff9800; }
        label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 14px; color: #ccc; }
        .field-box {
            width: 100%;
            padding: 12px;
            background: #2c2c2c;
            border: 1px solid #444;
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            box-sizing: border-box;
            font-family: inherit;
        }
        .field-box:focus { outline: none; border-color: #ff9800; }
        .counter { text-align: right; font-size: 13px; color: #888; margin: 5px 0 15px; }
        .counter.limit { color: #f44336; font-weight: bold; }
        .results { background: #252525; padding: 15px; border-radius: 8px; border-left: 4px solid #ff9800; margin-top: 20px; }
        .row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 15px; }
        .total { font-size: 20px; font-weight: bold; color: #4caf50; border-top: 1px solid #333; padding-top: 10px; margin-top: 10px; margin-bottom: 0; }
        .badge { background: #ff9800; color: #000; padding: 2px 6px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        button { width: 100%; margin-top: 15px; padding: 12px; background: #ff9800; color: #000; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:hover { background: #e68900; }
    </style>
</head>
<body>

<div class="card">
    <h2>Калькулятор контрактов</h2>
    
    <label>Текст объявления (макс. 300 знаков):</label>
    <div id="textContainer"></div>
    <div id="charCount" class="counter">0 / 300 символов</div>

    <label>Количество выходов (объявлений):</label>
    <input type="number" id="adQty" class="field-box" min="1" value="1">

    <div class="results">
        <div class="row"><span>Цена за 1 объявление:</span><span id="singlePrice">0 ₽</span></div>
        <div class="row"><span>Скидка за объем:</span><span id="discountInfo">0%</span></div>
        <div class="row"><span>Без скидки:</span><span id="rawTotal">0 ₽</span></div>
        <div class="row total"><span>ИТОГО К ОПЛАТЕ:</span><span id="finalTotal">0 ₽</span></div>
    </div>

    <button onclick="copySummary()">Скопировать расчет для отчета</button>
</div>

<script>
    const container = document.getElementById('textContainer');
    const adText = document.createElement('textarea');
    adText.className = 'field-box';
    adText.rows = 4;
    adText.maxLength = 300;
    adText.placeholder = 'Введите текст заказчика...';
    container.appendChild(adText);

    const adQty = document.getElementById('adQty');
    const charCount = document.getElementById('charCount');
    const singlePriceEl = document.getElementById('singlePrice');
    const discountInfoEl = document.getElementById('discountInfo');
    const rawTotalEl = document.getElementById('rawTotal');
    const finalTotalEl = document.getElementById('finalTotal');

    function formatMoney(num) {
        return num.toLocaleString('ru-RU') + ' ₽';
    }

    function calculate() {
        const length = adText.value.length;
        let qty = parseInt(adQty.value) || 0;
        if (qty < 0) qty = 0;

        charCount.textContent = length + ' / 300 символов';
        charCount.classList.toggle('limit', length >= 300);

        const singlePrice = length * 180;
        const rawTotal = singlePrice * qty;

        let discount = 0;
        if (qty >= 35) discount = 0.20;
        else if (qty >= 25) discount = 0.15;
        else if (qty >= 15) discount = 0.10;

        const finalTotal = Math.round(rawTotal * (1 - discount));

        singlePriceEl.textContent = formatMoney(singlePrice);
        discountInfoEl.innerHTML = discount > 0 ? '<span class="badge">-' + (discount * 100) + '%</span>' : '0%';
        rawTotalEl.textContent = formatMoney(rawTotal);
        finalTotalEl.textContent = formatMoney(finalTotal);
    }

    function copySummary() {
        const summary = 'Текст (' + adText.value.length + ' симв.): ' + adText.value + '\n' +
                        'Кол-во выходов: ' + (parseInt(adQty.value) || 0) + ' (Скидка: ' + discountInfoEl.textContent + ')\n' +
                        'Итого: ' + finalTotalEl.textContent;
        navigator.clipboard.writeText(summary).then(() => alert('Расчет скопирован!'));
    }

    adText.addEventListener('input', calculate);
    adQty.addEventListener('input', calculate);
</script>

</body>
</html>
