<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор объявлений — News GTA RP</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e1e1e;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 450px;
            border: 1px solid #333;
        }
        h2 {
            margin-top: 0;
            text-align: center;
            color: #ff9800;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
            color: #cccccc;
        }
        input {
            width: 100%;
            padding: 12px;
            background-color: #2c2c2c;
            border: 1px solid #444;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            border-color: #ff9800;
        }
        .counter {
            text-align: right;
            font-size: 13px;
            color: #888;
            margin-top: 5px;
            margin-bottom: 15px;
        }
        .counter.limit {
            color: #f44336;
            font-weight: bold;
        }
        #adQty {
            margin-bottom: 20px;
        }
        .results {
            background-color: #252525;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #ff9800;
        }
        .row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 15px;
        }
        .total {
            font-size: 20px;
            font-weight: bold;
            color: #4caf50;
            border-top: 1px solid #333;
            padding-top: 10px;
            margin-top: 10px;
            margin-bottom: 0;
        }
        .badge {
            background-color: #ff9800;
            color: #000;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        button {
            width: 100%;
            margin-top: 15px;
            padding: 12px;
            background-color: #ff9800;
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #e68900;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Калькулятор контрактов</h2>
    
    <label for="adText">Текст объявления (макс. 300 знаков):</label>
    <input type="text" id="adText" maxlength="300" placeholder="Вставьте или введите текст заказчика...">
    <div id="charCount" class="counter">0 / 300 символов</div>

    <label for="adQty">Количество выходов (объявлений):</label>
    <input type="number" id="adQty" min="1" value="1">

    <div class="results">
        <div class="row">
            <span>Цена за 1 объявление:</span>
            <span id="singlePrice">0 ₽</span>
        </div>
        <div class="row">
            <span>Скидка за объем:</span>
            <span id="discountInfo">0%</span>
        </div>
        <div class="row">
            <span>Без скидки:</span>
            <span id="rawTotal">0 ₽</span>
        </div>
        <div class="row total">
            <span>ИТОГО К ОПЛАТЕ:</span>
            <span id="finalTotal">0 ₽</span>
        </div>
    </div>

    <button onclick="copySummary()">Скопировать расчет для отчета</button>
</div>

<script>
    const PRICE_PER_CHAR = 180;
    const adText = document.getElementById('adText');
    const adQty = document.getElementById('adQty');
    const charCount = document.getElementById('charCount');
    const singlePriceEl = document.getElementById('singlePrice');
    const discountInfoEl = document.getElementById('discountInfo');
    const rawTotalEl = document.getElementById('rawTotal');
    const finalTotalEl = document.getElementById('finalTotal');

    function formatMoney(num) {
        return num.toLocaleString('ru-RU') + ' ₽';
    }

    function calculate() {
        const text = adText.value;
        const length = text.length;
        let qty = parseInt(adQty.value) || 0;
        if (qty < 0) qty = 0;

        charCount.textContent = `${length} / 300 символов`;
        if (length >= 300) {
            charCount.classList.add('limit');
        } else {
            charCount.classList.remove('limit');
        }

        const singlePrice = length * PRICE_PER_CHAR;
        const rawTotal = singlePrice * qty;

        let discount = 0;
        if (qty >= 35) {
            discount = 0.20;
        } else if (qty >= 25) {
            discount = 0.15;
        } else if (qty >= 15) {
            discount = 0.10;
        }

        const finalTotal = Math.round(rawTotal * (1 - discount));

        singlePriceEl.textContent = formatMoney(singlePrice);
        discountInfoEl.innerHTML = discount > 0 ? `<span class="badge">-${discount * 100}%</span>` : '0%';
        rawTotalEl.textContent = formatMoney(rawTotal);
        finalTotalEl.textContent = formatMoney(finalTotal);
    }

    function copySummary() {
        const length = adText.value.length;
        const qty = parseInt(adQty.value) || 0;
        const total = finalTotalEl.textContent;
        const discount = discountInfoEl.textContent;
        
        const summary = `Текст (${length} симв.): ${adText.value}\nКол-во выходов: ${qty} (Скидка: ${discount})\nИтого: ${total}`;
        
        navigator.clipboard.writeText(summary).then(() => {
            alert('Расчет скопирован в буфер обмена!');
        });
    }

    adText.addEventListener('input', calculate);
    adQty.addEventListener('input', calculate);
</script>

</body>
</html>
